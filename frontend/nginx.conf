server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API calls: the browser talks to nginx, nginx forwards to the backend.
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port, so Spring treats the browser's Origin as same-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Client-side routing: unknown paths fall back to the React app.
    location / {
        try_files $uri /index.html;
    }
}
