spring:
  application:
    name: taskflow
  config:
    # For local runs (IDE / bootRun), pick up the repo's .env so POSTGRES_PASSWORD, JWT_SECRET etc.
    # don't need to be set by hand. Real environment variables still take precedence.
    # Covers both working directories: the repo root (IntelliJ) and backend/ (gradle bootRun).
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    # PostgreSQL only. Defaults match a local Postgres (e.g. `docker compose up postgres`);
    # override with DB_URL / DB_USERNAME / DB_PASSWORD (docker-compose.yml sets them).
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${BACKEND_PORT:8080}

taskflow:
  jwt:
    # Required. Must be at least 32 characters. Never commit a real value.
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT2H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}
  guest:
    # "Continue as guest" logs into the seeded demo account (needs SEED_ENABLED=true at least once).
    enabled: ${GUEST_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
