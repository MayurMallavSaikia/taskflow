spring:
  application:
    name: taskflow
  datasource:
    # Defaults to an in-memory H2 database (PostgreSQL mode) so the app runs without any setup.
    # Point DB_URL at PostgreSQL to use a real database (see docker-compose.yml).
    url: ${DB_URL:jdbc:h2:mem:taskflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

taskflow:
  jwt:
    # Required. Must be at least 32 characters. Never commit a real value.
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT2H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
